<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Berita - PT Bhakti Husada Wonosobo</title>
    <meta name="description" content="Baca publikasi resmi dan berita kegiatan PT Bhakti Husada Wonosobo.">
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="/index.html" class="flex items-center gap-3.5 group">
                    <img src="/assets/logo.png" alt="Logo PT Bhakti Husada" class="w-11 h-11 object-contain transition group-hover:scale-105">
                    <div>
                        <span class="block font-heading font-extrabold text-brand-900 text-base sm:text-lg leading-snug group-hover:text-teal-600 transition">PT Bhakti Husada Wonosobo</span>
                        <span class="block text-xs font-semibold text-slate-500 tracking-wider">Layanan Informasi Publik</span>
                    </div>
                </a>
                <nav class="hidden lg:flex items-center gap-4 xl:gap-6 2xl:gap-7 text-sm font-semibold text-slate-700">
                    <a href="/index.html" class="whitespace-nowrap hover:text-brand-900 transition">Beranda</a>
                    <a href="/profil.html" class="whitespace-nowrap hover:text-brand-900 transition">Profil</a>
                    <a href="/layanan.html" class="whitespace-nowrap hover:text-brand-900 transition">Layanan</a>
                    <a href="/katalog-produk.html" class="whitespace-nowrap hover:text-brand-900 transition">Katalog Alkes</a>
                    <a href="/informasi-publik.html" class="whitespace-nowrap hover:text-brand-900 transition">Informasi Publik</a>
                    <a href="/regulasi.html" class="whitespace-nowrap hover:text-brand-900 transition">Regulasi</a>
                    <a href="/kontak.html" class="whitespace-nowrap hover:text-brand-900 transition">Kontak</a>
                    <a href="/admin.html" class="whitespace-nowrap text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition">Portal Admin</a>
                </nav>
                <div class="hidden sm:flex items-center gap-2.5 shrink-0 ml-3">
                    <button onclick="openTrackingModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <span>Lacak Tiket</span>
                    </button>
                    <a href="/formulir-permohonan.html" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md transition">
                        Permohonan Informasi
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6" id="articleContainer">
            <!-- Rendered via JS -->
        </div>
    </main>

    <footer class="bg-brand-900 text-white border-t border-slate-800 py-10 text-center text-xs">
        <p>&copy; 2026 PT Bhakti Husada Wonosobo (Perseroda). All rights reserved.</p>
    </footer>

    <!-- Tracking Modal -->
    <div id="trackingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100 animate-fade-in">
            <button onclick="closeTrackingModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <h3 class="font-heading font-bold text-slate-800 text-lg mb-2">Lacak Status Permohonan</h3>
            <form onsubmit="submitTracking(event)" class="space-y-4">
                <input type="text" id="modalTicketInput" required placeholder="Contoh: REQ-20260805-A1B2" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-teal-500 font-mono">
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl text-sm transition">Cek Status Sekarang</button>
            </form>
            <div id="trackingResult" class="mt-4 hidden p-4 rounded-xl border text-sm"></div>
        </div>
    </div>

    <script type="module">
        import { getNews } from '/src/js/storage.js';

        document.addEventListener('DOMContentLoaded', () => {
            const newsList = getNews();
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug') || newsList[0].slug;

            const article = newsList.find(n => n.slug === slug) || newsList[0];
            const container = document.getElementById('articleContainer');

            container.innerHTML = `
                <a href="/berita.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-teal-600 hover:text-teal-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>Kembali ke Berita</span>
                </a>

                <div class="bg-white p-8 sm:p-12 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 text-xs text-slate-400">
                            <span class="bg-teal-50 text-teal-700 border border-teal-100 font-semibold px-3 py-1 rounded-full">${article.category}</span>
                            <span>${article.published_at}</span>
                        </div>
                        <h1 class="font-heading font-extrabold text-2xl sm:text-4xl text-slate-800 leading-tight">${article.title}</h1>
                    </div>

                    <div class="p-4 bg-teal-50/60 rounded-2xl border border-teal-100 text-xs text-slate-700 font-medium leading-relaxed">
                        ${article.summary}
                    </div>

                    <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line space-y-4 pt-2">
                        ${article.content}
                    </div>
                </div>
            `;
        });
    </script>
    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
